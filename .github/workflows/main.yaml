#CICD workflow for the K8s multi tier app

name: CICD workflow for the K8s multitier app
on:
  push:
    branches:
      - feature-branch

  schedule:
    - cron: '12 * * * 1-5'

  workflow_dispatch:

#permission: read

jobs:
  BUILD:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4
      
      - name: Install Maven
        run: mvn install

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-app
          path: target/*.war

      - name: notify if fails
        if: failure()
        run: "echo build failed and for more information check logs!"

  TESTING:
    runs-on: ubuntu-latest
    needs: BUILD
    steps:
      - name: code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          name: vprofile-app
      
      - name: maven Test
        run: mvn test

      - name: maven checkstyle
        run: mvn checkstyle:checkstyle

      - name: notify if fails
        if: failure()
        run: "echo echo build failed and for more information check logs!"

  SECURITY_SCAN:
    runs-on: ubuntu-latest
    needs: TESTING
    steps:
      - name: code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Trivy security scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-path: '.'
          severity-threshold: 'CRITICAL'
          format: 'json'
          exit-code: '0'
          vulnerability-type: 'os,library'
          output: 'trivy-report.json'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json

  PUBLISH:
    runs-on: ubuntu-latest
    #needs: ["BUILD", "TESTING", "SECURITY_SCAN"]
    steps:
      - name: code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: download artifact
        uses: actions/download-artifact@v4
        with:
          name: vprofile-app

      - name: build docker images
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/vprofile-app:latest -f Dockerfiles/app/multistage/Dockerfile Docker-files/app
          docker builld -t ${{ secrets.DOCKER_USERNAME }}/vprofile-db:latest -f Dockerfile/db/Dockerfile Docker-files/db
          docker build -t ${{ secrets.DOCKER_USERNAME }}/vprofile-web:latest -f Dockerfile/web/Dockerfile Docker-files/web

      - name: docker login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: push docker images
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/vprofile-app:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/vprofile-db:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/vprofile-web:latest

      - name: notify if fails
        if: failure()
        run: "echo build failed and for more information check logs!"