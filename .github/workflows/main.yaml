#Building a workflow pipeline for this multi tier project

name: K8S multitier workflow

on:
  push:
    branches:
      - main

    paths:
      - 'src/**'
      - 'pom.xml'
      - '.github/workflows/main.yaml'
  
  schedule:
    - cron: '12 * * * *'

  workflow_dispatch:

jobs:
  BUILD:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: Install Maven
        run: mvn install

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: vprofile-app
          path: target/*.war

      - name: Notify if build fails
        if: failure()
        run: echo "Build Job failed! Please check logs for the details"

  Testing:
    runs-on: ubuntu-latest
    needs: BUILD
    steps:
      - name: code checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: vprofile-app
      - name: Run tests
        run: mvn test
      - name: checkstyle
        run: mvn checkstyle:checkstyle

      - name: Notify if test fails
        if: failure()
        run: echo "Test Job failed! Please check logs for the details"

      